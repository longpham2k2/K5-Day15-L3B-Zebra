# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:
  low: 220          # tài khoản dùng pre-class ≥3 ngày
  base: 436         # học viên có hoạt động pre-class
  high: 721         # tổng tài khoản
  source: "data/preclass 05–25/11, evidence/data-mining.md (count.py)"

# Câu 7 hỏi số lần trong 7 ngày trả lời sai mà chưa chắc đã hiểu lại. 20/25 người nhớ số.
# Hệ số tuần → tháng ×4 (tự ước tính).
personas:
  - name: it
    share: 0.20            # 0–1 lần/tuần, 4/20
    uses_per_month: 4
    turns_per_session: 3
    source: "khảo sát n = 25, câu 7 — evidence/survey/results.csv"
  - name: vua
    share: 0.65            # 2–3 lần/tuần, 13/20
    uses_per_month: 10
    turns_per_session: 3
    source: "khảo sát n = 25, câu 7 — evidence/survey/results.csv"
  - name: nhieu
    share: 0.15            # 4–6 lần/tuần, 3/20
    uses_per_month: 20
    turns_per_session: 3
    source: "khảo sát n = 25, câu 7 — evidence/survey/results.csv"
# Một vòng có 3 lượt gọi agent (hỏi lý do → gợi ý → chấm), với 1 lần gọi model.
# Mô phỏng rút ngẫu nhiên 3 đầu vào thường/khó, nên có thể gọi model nhiều hơn mỗi vòng.
# Chi phí mô phỏng vì vậy là ước tính dè dặt.

prices:             # USD / 1 triệu token
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "OpenAI API — https://developers.openai.com/api/docs/models/gpt-5.4-nano#pricing · xem 28/11/2026"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "Bảng giá BTC, further-reading/model-prices.md trong repo đề · xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
